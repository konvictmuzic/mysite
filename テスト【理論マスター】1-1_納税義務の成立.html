<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF表示の完全対応</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2, h3 { color: #2563eb; }
        a { color: #3b82f6; text-decoration: none; display: inline-block; margin-bottom: 15px; }
        a:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            body { padding: 15px; }
            h1 { font-size: 1.5rem; }
            h2 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>
    <h1>問題と解答</h1>

    <!-- 1問目 -->
    <div class="questionCard">
        <p><strong>問題：</strong>趣旨（重要度：C)</p>
        <p>解答：</p>
        <div class="answerSection" id="question1">
            <div class="pdf-container">
                <object data="https://konvictmuzic.github.io/mysite/趣旨（重要度：C).pdf" type="application/pdf">
                    このブラウザではPDFを表示できません。PDFファイルは<a href="https://konvictmuzic.github.io/mysite/趣旨（重要度：C).pdf">こちら</a>からダウンロードしてください。
                </object>
            </div>
        </div>
        <button onclick="toggleAnswers('question1')">表示/非表示</button>
    </div>

    <!-- 2問目 -->
    <div class="questionCard">
        <p><strong>問題：</strong>1. 納税義務者の原則（重要度：AA)</p>
        <p>解答：</p>
        <div class="answerSection" id="question2">
            <p>⑴ 酒類の製造者は、その製造場から移出した酒類につき、酒税を納める義務がある。</p>
            <p>⑵ 酒類を保税地域から引き取る者は、その引き取る酒類につき、酒税を納める義務がある。</p>
        </div>
        <button onclick="toggleAnswers('question2')">表示/非表示</button>
    </div>

    <script>
        function toggleAnswers(questionId) {
            const section = document.getElementById(questionId);
            if (section.style.display === 'none' || section.style.display === '') {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        }
    </script>
</body>
</html>
